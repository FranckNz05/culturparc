# Deploiement Render de la billetterie Culture Parc.
#
# A importer via Render > New > Blueprint, en pointant ce depot.
# La base et le service web sont crees ensemble, et DATABASE_URL est injectee
# automatiquement depuis la base.

databases:
  - name: cultureparc-db
    databaseName: cultureparc
    user: cultureparc
    plan: free
    postgresMajorVersion: "17"
    # La region doit etre la meme que celle du service web : le reseau prive
    # de Render ne relie que des ressources d'une meme region, et le nom
    # d'hote interne dpg-... n'est pas resolvable au-dela.
    region: frankfurt

services:
  - type: web
    name: cultureparc
    runtime: node
    plan: free
    region: frankfurt # le plus proche de l'Afrique centrale chez Render
    branch: main

    # --include=dev est indispensable : Render fixe NODE_ENV=production, et
    # npm ci omettrait alors prisma, typescript, tailwind et sharp, tous
    # necessaires pour construire l'application.
    #
    # prisma generate doit preceder le build : le client est genere dans
    # src/generated, qui n'est pas versionne.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build

    # Les migrations tournent au demarrage, et non au build : la base n'est
    # joignable que depuis le reseau prive de Render, auquel le build n'a pas
    # acces. Les y laisser produisait un P1001 "Can't reach database server".
    #
    # npm start passe par scripts/start.mjs : il attend que la base reponde,
    # applique les migrations, puis lance le serveur. Au premier deploiement,
    # la base est encore en cours de creation quand le service demarre.
    #
    # migrate deploy n'applique que des migrations deja ecrites, ne touche
    # jamais aux donnees existantes, et ne fait rien quand la base est deja a
    # jour.
    startCommand: npm start

    healthCheckPath: /api/sante

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cultureparc-db
          property: connectionString

      - key: NODE_VERSION
        value: "22"

      # Sans cette variable, le serveur raisonne en UTC alors que les salles
      # vivent a l'heure de Brazzaville (UTC+1, sans changement d'heure). Une
      # seance de 19h00 s'afficherait 18h00, et le poste de controle chercherait
      # les seances de la mauvaise heure. Les horaires sont le coeur du metier :
      # ils doivent etre justes, pas approximativement justes.
      - key: TZ
        value: "Africa/Brazzaville"

      # Render coupe les connexions inactives : une pool modeste suffit sur le
      # plan gratuit, qui limite de toute facon le nombre de connexions.
      - key: DATABASE_POOL_MAX
        value: "5"

      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: cultureparc
          envVarKey: RENDER_EXTERNAL_URL

      # Secrets generes une fois par Render, jamais commites.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"

      # ATTENTION : changer cette cle invalide tous les billets deja emis.
      # A generer avec "openssl rand -hex 32" et a saisir dans le tableau de
      # bord Render, puis a conserver precieusement.
      - key: TICKET_QR_SECRET
        sync: false

      # Mode demonstration. Passer a "false" le jour ou les identifiants
      # operateurs sont renseignes, sans quoi aucun encaissement n'a lieu.
      - key: PAYMENT_SIMULATION
        value: "true"

      # Airtel Money
      - key: AIRTEL_PRODUCTION
        value: "false"
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_COUNTRY
        value: "CG"
      - key: AIRTEL_CURRENCY
        value: "XAF"

      # MTN Mobile Money
      - key: MTN_MOMO_BASE_URL
        value: "https://sandbox.momodeveloper.mtn.com"
      - key: MTN_MOMO_TARGET_ENVIRONMENT
        value: "sandbox"
      - key: MTN_MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false

      # Notifications aux clients
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      - key: SEAT_HOLD_MINUTES
        value: "10"
